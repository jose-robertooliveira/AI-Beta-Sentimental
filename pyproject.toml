[project]
name = "sentiments-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jose-robertooliveira", email = "negroafrolife@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "textblob>=0.20.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[project.scripts]
sentiments-analyzer = "sentiments_analyzer:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
